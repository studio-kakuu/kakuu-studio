<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KAKUU STUDIO</title>
<meta name="description" content="KAKUU STUDIO — 実在しないお店・ブランドのWebサイトをつくるスタジオ。">
<meta name="theme-color" content="#0E0E0E">
<link rel="icon" href="brand/logo-on-black.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="brand/colors.css">
<style>
  :root {
    --font: "Space Grotesk", "Zen Kaku Gothic New", sans-serif;
    --dim: rgba(255, 255, 255, .56);
    --rule: rgba(255, 255, 255, .14);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--kakuu-black);
    color: var(--kakuu-white);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.8;
    letter-spacing: .02em;
  }
  a { color: inherit; text-decoration: none; }
  .wrap { width: min(100% - 40px, 1120px); margin-inline: auto; }

  header .wrap { display: flex; align-items: center; justify-content: space-between; height: 72px; }
  header img { height: 18px; width: auto; display: block; }
  header nav { display: flex; gap: 20px; font-size: 12px; letter-spacing: .14em; }
  header nav a { color: var(--dim); transition: color .3s; }
  header nav a:hover { color: var(--kakuu-accent); }

  .intro { padding: 72px 0 64px; border-bottom: 1px solid var(--rule); }
  .intro h1 {
    margin: 0;
    font-weight: 500;
    font-size: clamp(40px, 11vw, 112px);
    line-height: 1;
    letter-spacing: -.02em;
  }
  .intro h1 span { color: var(--kakuu-accent); }
  .intro p { margin: 28px 0 0; max-width: 34em; color: var(--dim); font-size: 14px; }
  .intro p b { color: var(--kakuu-white); font-weight: 500; }

  .list-head {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 40px 0 20px; font-size: 12px; letter-spacing: .16em; color: var(--dim);
  }
  .list-head b { color: var(--kakuu-accent); font-weight: 500; }

  .works { list-style: none; margin: 0; padding: 0 0 96px; display: grid; gap: 20px; }
  .work a { display: block; }
  .thumb {
    position: relative;
    aspect-ratio: 4 / 5;
    border-radius: 6px;
    overflow: hidden;
    background: var(--c1);
    color: var(--c2);
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 22px;
    transition: transform .6s cubic-bezier(.2, .7, .2, 1);
  }
  .thumb::after {
    content: ""; position: absolute; width: 70%; aspect-ratio: 1; border-radius: 50%;
    right: -18%; bottom: -14%; background: var(--c3); opacity: .9;
    transition: transform .8s cubic-bezier(.2, .7, .2, 1);
  }
  .thumb-name { position: relative; z-index: 1; font-size: clamp(44px, 14vw, 72px); font-weight: 500; line-height: 1; letter-spacing: .04em; }
  .thumb-ja { position: relative; z-index: 1; font-size: 13px; letter-spacing: .3em; }
  .work a:hover .thumb { transform: translateY(-4px); }
  .work a:hover .thumb::after { transform: scale(1.12); }

  .meta { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: baseline; padding: 14px 2px 0; }
  .meta .no { color: var(--kakuu-accent); font-size: 12px; letter-spacing: .1em; }
  .meta .title { font-size: 15px; font-weight: 500; }
  .meta .title small { display: block; color: var(--dim); font-size: 12px; font-weight: 400; }
  .meta .time { font-size: 12px; color: var(--dim); white-space: nowrap; }
  .meta .arrow { display: inline-block; transition: transform .3s; }
  .work a:hover .arrow { transform: translateX(4px); color: var(--kakuu-accent); }

  footer { border-top: 1px solid var(--rule); padding: 28px 0 40px; font-size: 12px; color: var(--dim); }
  footer .wrap { display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; }
  footer a:hover { color: var(--kakuu-accent); }

  @media (min-width: 640px) { .works { grid-template-columns: repeat(2, 1fr); gap: 28px; } }
  @media (min-width: 980px) { .works { grid-template-columns: repeat(3, 1fr); gap: 32px; } .intro { padding: 120px 0 96px; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a href="./" aria-label="KAKUU STUDIO"><img src="brand/logo.svg" alt="KAKUU STUDIO"></a>
    <nav>
      <a href="#works">WORKS</a>
      <a href="https://www.instagram.com/studio_kakuu/" rel="noopener">INSTAGRAM</a>
    </nav>
  </div>
</header>

<main>
  <section class="intro">
    <div class="wrap">
      <h1>Websites for<br>places that<br>don’t exist<span>.</span></h1>
      <p><b>実在しないお店・ブランドのWebサイトを、毎回ひとつ。</b><br>KAKUU STUDIO は、架空のブランドを考え、その世界をWebでかたちにしていく小さなスタジオです。制作の過程はショート動画で公開しています。</p>
    </div>
  </section>

  <section id="works">
    <div class="wrap">
      <div class="list-head"><span>WORKS</span><span><b id="count">01</b> / ARCHIVE</span></div>
      <ul class="works" id="works-list">
        <!-- works.js から自動生成。JSが無効な環境用のフォールバック -->
        <noscript><li><a href="works/cafe/">001 — YUGE 湯気と珈琲(架空のカフェ)</a></li></noscript>
      </ul>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span>© KAKUU STUDIO — All brands shown here are fictional.</span>
    <span>@studio_kakuu</span>
  </div>
</footer>

<script src="works.js"></script>
<script>
  (function () {
    var list = document.getElementById('works-list');
    var works = window.KAKUU_WORKS || [];
    var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
    list.innerHTML = works.map(function (w) {
      var p = w.palette || ['#FFFFFF', '#0E0E0E', '#C6FF3D'];
      return '<li class="work"><a href="works/' + esc(w.slug) + '/">' +
        '<div class="thumb" style="--c1:' + esc(p[0]) + ';--c2:' + esc(p[1]) + ';--c3:' + esc(p[2]) + '">' +
          '<span class="thumb-name">' + esc(w.name) + '</span>' +
          '<span class="thumb-ja">' + esc(w.nameJa) + '</span>' +
        '</div>' +
        '<div class="meta">' +
          '<span class="no">' + esc(w.no) + '</span>' +
          '<span class="title">' + esc(w.name) + ' ' + esc(w.nameJa) + '<small>' + esc(w.theme) + ' / ' + esc(w.themeEn) + '</small></span>' +
          '<span class="time">' + esc(w.minutes) + ' min <span class="arrow">→</span></span>' +
        '</div></a></li>';
    }).join('');
    document.getElementById('count').textContent = String(works.length).padStart(2, '0');
  })();
</script>
</body>
</html>
