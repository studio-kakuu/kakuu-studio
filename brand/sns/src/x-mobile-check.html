<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>X mobile check</title>
<style>
  /* スマホ版Xのプロフィール上部を再現(幅390px)。確認用でありSNSには使わない */
  body { margin: 0; width: 390px; background: #fff; font-family: sans-serif; }
  .hdr { position: relative; width: 390px; height: 130px; background: url(../x_header_1500x500.png) center/cover; }
  .btn { position: absolute; top: 10px; width: 34px; height: 34px; border-radius: 50%; background: rgba(15,20,25,.75); color: #fff; display: grid; place-items: center; font-size: 17px; }
  .back { left: 12px; } .search { right: 54px; } .more { right: 12px; }
  .avatar { position: absolute; left: 14px; top: 100px; width: 84px; height: 84px; border-radius: 50%; border: 4px solid #fff; background: url(../profile_1080.png) center/cover; }
  .btnrow { height: 70px; } .name { padding: 0 16px; font-weight: 700; font-size: 20px; color: #0f1419; }
  .guide .hdr::before, .guide .hdr::after { content: ""; position: absolute; top: 0; height: 39px; width: 90px; outline: 1px dashed red; }
  .guide .hdr::before { left: 0; } .guide .hdr::after { right: 0; }
</style></head>
<body class="guide">
  <div class="hdr"><div class="btn back">←</div><div class="btn search">⌕</div><div class="btn more">⋯</div><div class="avatar"></div></div>
  <div class="btnrow"></div><div class="name">KAKUU STUDIO</div><br>
</body></html>
